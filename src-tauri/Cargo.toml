[package]
name = "kryova"
version = "0.2.0"
description = "AI-native CAD + FEA"
authors = ["Kryova"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# The desktop entry point is a library so the same code can back a future
# mobile target; main.rs is a thin shim over it.
name = "kryova_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` for the tray (ROAD_TO_10 4.7).
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"
# `deep-link` so a `kryova://` link clicked while Kryova is open reaches the open window
# instead of starting a second app (Windows and Linux start a new process per link).
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[features]
# Enabled by `tauri build`; keeps devtools out of a shipped binary.
custom-protocol = ["tauri/custom-protocol"]
