[package]
name = "kryova"
version = "0.1.0"
description = "AI-native CAD + FEA"
authors = ["Kryova"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# The desktop entry point is a library so the same code can back a future
# mobile target; main.rs is a thin shim over it.
name = "kryova_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Enabled by `tauri build`; keeps devtools out of a shipped binary.
custom-protocol = ["tauri/custom-protocol"]
