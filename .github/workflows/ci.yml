name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm ci` rather than `npm install`: it fails loudly when
      # package-lock.json and package.json have drifted, instead of quietly
      # resolving a different tree than any developer has locally.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm run test

      # Build last: it is the slowest step and the one most likely to be
      # explained by a failure above.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
