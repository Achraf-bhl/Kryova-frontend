# Tauri shell compile check -- and the record of why there is no release job here.
#
# THE DECISION (2026-09-06): a tagged release must NOT build and publish the MSI
# yet. Not "not worth it" -- it would publish a broken installer. Three reasons,
# each checkable in this repo:
#
#  1. The installer bakes absolute paths of the build machine into the binary.
#     `src-tauri/src/lib.rs` resolves the two checkouts through
#     `option_env!("KRYOVA_FRONTEND_DIR")` / `option_env!("KRYOVA_BACKEND_DIR")`
#     and node through `option_env!("KRYOVA_NODE")`, all fixed at *compile*
#     time by `scripts/desktop-build.mjs`. An MSI built on a runner therefore
#     ships pointing at `D:\a\Kryova-frontend\...` and a runner-local node. On a
#     customer's machine those paths do not exist, so the app starts no backend
#     and no frontend, waits out its 90-second timeout, and shows a window that
#     failed to load -- a failure whose message names none of this.
#  2. `src-tauri/tauri.conf.json` sets `frontendDist: "http://localhost:3000"`.
#     The desktop app is a shell that launches the dev server from a checkout on
#     disk; it does not bundle a static build. A public release artefact needs a
#     bundled frontend and a packaged backend first -- that is master plan P9.2
#     (backend images) and P9.4, not a line in a workflow.
#  3. Nothing has ever installed the MSI and confirmed the app starts from it.
#     The master plan's P7 row says so in as many words: "Built is not
#     installed". Publishing an artefact whose only evidence is that the build
#     command exited zero is exactly the "green on a suite nobody ran" failure
#     this project exists to refuse.
#
# There is also no code signing certificate and no `latest.json`, so even a
# correct MSI would trip SmartScreen and could not auto-update. Those are P9.4
# and P7.1 and they need secrets nobody should invent here (see the report).
#
# WHAT THIS FILE DOES INSTEAD: type-checks the Rust half on Windows so a change
# to `src-tauri/` cannot rot unnoticed between the rare desktop builds. It is
# `workflow_dispatch` only -- it gates nothing, it produces no artefact, and it
# makes no claim about installability. Turn it into a release pipeline when 1-3
# above are actually fixed, not before.
#
# Locally, the identical check:
#
#   cd src-tauri && cargo check --locked
#
# (12.6 s warm on the Windows seat, rust 1.98.)

name: Desktop shell

on:
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cargo-check:
    name: cargo check (Windows)
    # windows, because Windows is the CATIA audience and the only target the
    # desktop app has ever been built for. The runner image ships a stable Rust
    # toolchain and WebView2, so no third-party toolchain action is needed --
    # one less unpinned dependency in a job that runs with a checkout.
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Rust version in use
        run: |
          rustc --version
          cargo --version

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # `--locked` so a drifted Cargo.lock fails here rather than silently
      # resolving a different tree than the machine that last built an MSI.
      - name: cargo check
        working-directory: src-tauri
        run: cargo check --locked
